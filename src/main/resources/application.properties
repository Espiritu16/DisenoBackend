spring.application.name=aquacomunidad-backend
spring.config.import=optional:file:.env[.properties]

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://diseno-frontend.vercel.app,https://diseno-frontend-7n1672j2y-espiritu16s-projects.vercel.app,https://*.vercel.app,https://proyectoutp.com,http://proyectoutp.com,http://localhost:*,https://localhost:*,http://127.0.0.1:*,https://127.0.0.1:*}

# OpenAI chatbot (no colocar claves reales en el repositorio)
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=${OPENAI_MODEL:gpt-5-mini}

# Gmail SMTP (recuperacion de contrasena)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8

# JWT
app.jwt.secreto=${APP_JWT_SECRETO:CAMBIAR_ESTE_SECRETO_POR_UNO_MUY_SEGURO_DE_64_CARACTERES}
app.jwt.expiracion-segundos=${APP_JWT_EXPIRACION_SEGUNDOS:7200}
app.jwt.refresh-expiracion-segundos=${APP_JWT_REFRESH_EXPIRACION_SEGUNDOS:2592000}

# Uploads
app.upload.storage=${UPLOAD_STORAGE:local}
app.upload.dir=${UPLOAD_DIR:/app/uploads}
app.upload.public-base-url=${UPLOAD_PUBLIC_BASE_URL:/uploads}
app.upload.webp-command=${WEBP_COMMAND:cwebp}
app.upload.webp-quality=${WEBP_QUALITY:86}
app.upload.cache.max-age-seconds=${UPLOAD_CACHE_MAX_AGE_SECONDS:2592000}
app.upload.sftp.host=${UPLOAD_SFTP_HOST:}
app.upload.sftp.port=${UPLOAD_SFTP_PORT:22}
app.upload.sftp.user=${UPLOAD_SFTP_USER:}
app.upload.sftp.private-key=${UPLOAD_SFTP_PRIVATE_KEY:}
app.upload.sftp.private-key-path=${UPLOAD_SFTP_PRIVATE_KEY_PATH:}
app.upload.sftp.remote-base-dir=${UPLOAD_REMOTE_BASE_DIR:/opt/proyectos/aquacomunidad/uploads}
app.upload.sftp.strict-host-key-checking=${UPLOAD_SFTP_STRICT_HOST_KEY_CHECKING:no}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB

# Base de datos (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aquacomunidad_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.open-in-view=false
